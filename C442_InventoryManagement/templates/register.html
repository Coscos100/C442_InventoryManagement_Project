{% extends "base.html" %}
{% block show_navbar %}{% endblock %}
{% block content %}

<h2 style="text-align:center;">Create an Account</h2>

<div class="auth-container">
    <form method="POST" action="{{ url_for('auth.register') }}" style="max-width:400px; margin:auto;">

        <label>Username:</label><br>
        <input type="text" name="username" required style="width:100%;"><br><br>

        <label>Password:</label><br>
        <input type="password" name="password" required style="width:100%;"><br><br>

        <button type="submit">Sign Up</button>

        <small>
            Already have an account? <a href="{{ url_for('auth.login') }}">Login</a>
        </small>

    </form>

</div>
{% endblock %}
